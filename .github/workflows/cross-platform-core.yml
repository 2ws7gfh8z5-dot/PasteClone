name: Cross-platform core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Swift core — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        with:
          swift-version: swift-5.9.2-release
          swift-build: 5.9.2-RELEASE
      - name: Swift version
        run: swift --version
      - name: Test shared core
        working-directory: SharedCore
        run: swift test
