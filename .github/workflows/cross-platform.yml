name: Cross-platform clients

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux suspended as of 1.8.0; no new Linux builds are published.
          - { name: Windows portable, os: windows-2022, target: x86_64-pc-windows-msvc, binary: pasteclone-desktop.exe, archive: PasteClone-Windows-x86_64.zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        working-directory: CrossPlatformClient
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        working-directory: CrossPlatformClient
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: CrossPlatformClient
        run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary }} -DestinationPath ../${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
