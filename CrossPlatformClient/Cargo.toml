[package]
name = "pasteclone-desktop"
version = "1.5.1"
edition = "2021"
description = "PasteClone experimental Windows and Linux desktop client"
license = "MIT"

[dependencies]
arboard = "3.6"
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11"] }
enigo = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
