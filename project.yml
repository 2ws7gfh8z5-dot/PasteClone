name: PasteClone
options:
  bundleIdPrefix: com.you
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  PasteClone:
    type: application
    platform: macOS
    sources:
      - path: PasteClone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.PasteClone
        PRODUCT_NAME: PasteClone
        INFOPLIST_FILE: PasteClone/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: PasteClone/Resources/Info.plist
      properties:
        CFBundleName: PasteClone
        CFBundleDisplayName: PasteClone
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright 2024. All rights reserved."
        NSAppleEventsUsageDescription: "PasteClone 需要访问剪贴板以记录和回放内容。"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: PasteClone/Resources/PasteClone.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
